version: "2"

run:
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck       # Check for unchecked errors
    - govet          # Reports suspicious constructs
    - staticcheck    # Static analysis (includes gosimple + unused checks)
    - ineffassign    # Detects unused assignments
    - revive         # Replaces deprecated golint
    - gosec          # Security checks
    - unconvert      # Removes unnecessary type conversions
    - dupl           # Code clone detection
    - goconst        # Finds repeated strings that could be constants
    - gocyclo        # Cyclomatic complexity
    - lll            # Reports long lines
    - unparam        # Reports unused function parameters
    - nakedret       # Finds naked returns
    - prealloc       # Finds slice declarations that could be preallocated
    - gocritic       # Opinionated source code linter
    - gochecknoinits # Checks that no init functions are present
    - gochecknoglobals # Checks that no globals are present

  settings:
    govet:
      enable:
        - shadow
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocyclo:
      min-complexity: 7
    lll:
      line-length: 120
    goconst:
      min-occurrences: 4  # Suppress 3-occurrence matches common in multi-version schema files
    revive:
      rules:
        # Disable rules that would require extensive API-breaking changes to pre-existing code
        - name: var-naming
          disabled: true
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: unexported-return
          disabled: true

  exclusions:
    rules:
      # Suppress gosec, errcheck, and goconst noise in test files
      - path: "_test\\.go"
        linters:
          - gosec
          - errcheck
          - goconst
      # G304: File path from variable - legitimate for loading user-specified cert/config files
      - linters:
          - gosec
        text: "G304"
      # goconst: schema field names are intentionally repeated across v3.2/3.3/3.4 version files
      - path: "pkg/compliant/schema"
        linters:
          - goconst

formatters:
  enable:
    - gofmt          # Checks gofmt formatting

  settings:
    gofmt:
      simplify: true

output:
  formats:
    text:
      print-issued-lines: false
      print-linter-name: true
