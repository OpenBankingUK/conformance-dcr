run:
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck       # Check for unchecked errors
    - govet          # Reports suspicious constructs
    - staticcheck    # Static analysis (includes former gosimple + unused checks)
    - gosimple       # Simplification suggestions
    - unused         # Unused code
    - ineffassign    # Detects unused assignments
    - typecheck      # Parses and type-checks Go code
    - revive         # Replaces deprecated golint
    - gofmt          # Checks gofmt formatting
    - gosec          # Security checks
    - unconvert      # Removes unnecessary type conversions
    - dupl           # Code clone detection
    - goconst        # Finds repeated strings that could be constants
    - gocyclo        # Cyclomatic complexity
    - lll            # Reports long lines
    - unparam        # Reports unused function parameters
    - nakedret       # Finds naked returns
    - prealloc       # Finds slice declarations that could be preallocated
    - gocritic       # Opinionated source code linter
    - gochecknoinits # Checks that no init functions are present
    - gochecknoglobals # Checks that no globals are present

# all available settings of specific linters
linters-settings:
  govet:
    enable:
      - shadow
  errcheck:
    # report about not checking of errors in type assertions
    check-type-assertions: true
    # report about assignment of errors to blank identifier
    check-blank: true
  revive:
    min-confidence: 1.0
  gofmt:
    # simplify code: gofmt with `-s` option
    simplify: true
  misspell:
    locale: UK
  gocyclo:
    min-complexity: 7
  lll:
    line-length: 120
  goimports:
    local-prefixes: github.com/OpenBankingUK/conformance-dcr

output:
  formats:
    - format: colored-line-number
  print-issued-lines: false
  print-linter-name: true

issues:
  # Maximum issues count per one linter. Set to 0 to disable. Default is 50.
  max-per-linter: 0

  # Maximum count of issues with the same text. Set to 0 to disable. Default is 3.
  max-same-issues: 0
